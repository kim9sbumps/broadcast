<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화면 송출 (Host)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; }
    .video-box { width: 80vw; max-width: 960px; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .controls { display: flex; gap: 12px; align-items: center; }
    button { padding: 10px 20px; font-size: 15px; font-weight: bold; background: #2e7d32; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
    #status { font-size: 14px; color: #aaa; }
  </style>
</head>
<body>

  <h2>🎮 게임 화면 송출 (Host)</h2>
  
  <div class="video-box">
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

  <div class="controls">
    <button id="startBtn" onclick="startStream()">화면 및 소리 공유 시작</button>
    <span id="status">대기 중...</span>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, set, push, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4gexCqmXXR0BoWWIl3j84De-NrX7msYA",
      authDomain: "paper-boat-695f8.firebaseapp.com",
      databaseURL: "https://paper-boat-695f8-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "paper-boat-695f8",
      storageBucket: "paper-boat-695f8.firebasestorage.app",
      messagingSenderId: "500229195135",
      appId: "1:500229195135:web:cdb336f8acdcbe662b064a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const sessionRef = ref(db, 'stream_session');

    let localStream = null;
    let peerConnection = null;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    window.startStream = async function() {
      const startBtn = document.getElementById('startBtn');
      const status = document.getElementById('status');

      try {
        // 1. 화면 및 오디오 캡처 (오디오 실패 시 비디오 단독 캡처로 자동 폴백)
        try {
          localStream = await navigator.mediaDevices.getDisplayMedia({
            video: { frameRate: { ideal: 60, max: 60 } },
            audio: true
          });
        } catch (mediaErr) {
          console.warn("오디오 포함 캡처 실패, 비디오만 재시도:", mediaErr);
          localStream = await navigator.mediaDevices.getDisplayMedia({
            video: { frameRate: { ideal: 60, max: 60 } },
            audio: false
          });
        }

        document.getElementById('localVideo').srcObject = localStream;
        startBtn.disabled = true;
        status.innerText = "연결 방 생성 중...";

        // 이전 세션 DB 완전 초기화
        await remove(sessionRef);

        // 2. PeerConnection 생성 및 트랙 추가
        peerConnection = new RTCPeerConnection(rtcConfig);

        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });

        // ICE Candidate 전송
        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            push(ref(db, 'stream_session/hostCandidates'), event.candidate.toJSON());
          }
        };

        peerConnection.onconnectionstatechange = () => {
          status.innerText = `연결 상태: ${peerConnection.connectionState}`;
        };

        // 3. Offer 생성 및 저장
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        await set(ref(db, 'stream_session/offer'), {
          type: offer.type,
          sdp: offer.sdp
        });

        status.innerText = "친구의 접속을 기다리는 중...";

        // 4. Client Answer 수신 대기
        const answerRef = ref(db, 'stream_session/answer');
        const checkAnswerInterval = setInterval(async () => {
          if (peerConnection.currentRemoteDescription) return;
          
          const { get } = await import("https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js");
          const snap = await get(answerRef);
          if (snap.exists() && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(snap.val()));
            status.innerText = "친구와 연결되었습니다! (송출 중)";
            clearInterval(checkAnswerInterval);
          }
        }, 1000);

        // 5. Client ICE Candidates 실시간 반영
        onChildAdded(ref(db, 'stream_session/clientCandidates'), async (snapshot) => {
          const cand = snapshot.val();
          if (cand && peerConnection) {
            try {
              await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
            } catch (e) {
              console.error("Client Candidate 추가 오류:", e);
            }
          }
        });

        // 사용자가 화면 공유 창을 닫았을 때
        localStream.getVideoTracks()[0].onended = () => {
          remove(sessionRef);
          location.reload();
        };

      } catch (err) {
        console.error("스트리밍 시작 실패:", err);
        status.innerText = "화면 공유가 취소되었거나 브라우저 권한 오류입니다.";
        startBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
