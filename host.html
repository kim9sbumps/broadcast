<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화면 송출 (Host)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; }
    .video-box { width: 80vw; max-width: 960px; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .controls { display: flex; gap: 12px; align-items: center; }
    button { padding: 10px 20px; font-size: 15px; font-weight: bold; background: #2e7d32; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
    #status { font-size: 14px; color: #aaa; }
  </style>
</head>
<body>

  <h2>🎮 게임 화면 송출 (Host)</h2>
  
  <div class="video-box">
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

  <div class="controls">
    <button id="startBtn" onclick="startStream()">화면 및 소리 공유 시작</button>
    <span id="status">대기 중...</span>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4gexCqmXXR0BoWWIl3j84De-NrX7msYA",
      authDomain: "paper-boat-695f8.firebaseapp.com",
      databaseURL: "https://paper-boat-695f8-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "paper-boat-695f8",
      storageBucket: "paper-boat-695f8.firebasestorage.app",
      messagingSenderId: "500229195135",
      appId: "1:500229195135:web:cdb336f8acdcbe662b064a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const roomRef = ref(db, 'stream_session');

    let localStream = null;
    let peerConnection = null;

    const rtcConfig = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    window.startStream = async function() {
      const startBtn = document.getElementById('startBtn');
      const status = document.getElementById('status');

      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            cursor: "always",
            frameRate: { ideal: 60, max: 60 },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: true
        });

        document.getElementById('localVideo').srcObject = localStream;
        startBtn.disabled = true;
        status.innerText = "연결 준비 중...";

        await remove(roomRef);

        peerConnection = new RTCPeerConnection(rtcConfig);

        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });

        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            set(ref(db, `stream_session/hostCandidates/${Date.now()}`), event.candidate.toJSON());
          }
        };

        peerConnection.onconnectionstatechange = () => {
          status.innerText = `연결 상태: ${peerConnection.connectionState}`;
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        await set(ref(db, 'stream_session/offer'), {
          type: offer.type,
          sdp: offer.sdp
        });

        status.innerText = "친구의 접속을 기다리는 중...";

        onValue(ref(db, 'stream_session/answer'), async (snapshot) => {
          const answer = snapshot.val();
          if (answer && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            status.innerText = "친구와 연결되었습니다! (송출 중)";
          }
        });

        onValue(ref(db, 'stream_session/clientCandidates'), (snapshot) => {
          const candidates = snapshot.val();
          if (candidates) {
            Object.values(candidates).forEach(async (cand) => {
              try {
                await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
              } catch (e) {
                console.error("Candidate 추가 오류:", e);
              }
            });
          }
        });

        localStream.getVideoTracks()[0].onended = () => {
          remove(roomRef);
          location.reload();
        };

      } catch (err) {
        console.error("스트리밍 시작 실패:", err);
        status.innerText = "화면 공유가 취소되었거나 오류가 발생했습니다.";
        startBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
