<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화면 송출 (Host)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; }
    .video-box { width: 80vw; max-width: 960px; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .controls { display: flex; gap: 12px; align-items: center; flex-direction: column; }
    button { padding: 12px 24px; font-size: 15px; font-weight: bold; background: #2e7d32; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
    #status { font-size: 14px; color: #aaa; text-align: center; max-width: 600px; line-height: 1.5; }
    .err-text { color: #ff6b6b !important; font-weight: bold; }
  </style>
</head>
<body>

  <h2>🎮 게임 화면 송출 (Host)</h2>
  
  <div class="video-box">
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

  <div class="controls">
    <button id="startBtn" onclick="startStream()">화면 및 소리 공유 시작</button>
    <div id="status">대기 중...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, set, push, onChildAdded, remove, onValue } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4gexCqmXXR0BoWWIl3j84De-NrX7msYA",
      authDomain: "paper-boat-695f8.firebaseapp.com",
      databaseURL: "https://paper-boat-695f8-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "paper-boat-695f8",
      storageBucket: "paper-boat-695f8.firebasestorage.app",
      messagingSenderId: "500229195135",
      appId: "1:500229195135:web:cdb336f8acdcbe662b064a"
    };


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const sessionRef = ref(db, 'stream_session');

    let localStream = null;
    let peerConnection = null;
    const clientCandidateQueue = [];

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    window.startStream = async function() {
      const startBtn = document.getElementById('startBtn');
      const status = document.getElementById('status');
      status.className = "";

      try {
        status.innerText = "1단계: 화면 공유 선택 중...";
        
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

        document.getElementById('localVideo').srcObject = localStream;
        startBtn.disabled = true;

        status.innerText = "2단계: 이전 세션 초기화 중...";
        await remove(sessionRef);

        status.innerText = "3단계: P2P 연결 생성 중...";
        peerConnection = new RTCPeerConnection(rtcConfig);

        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });

        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            push(ref(db, 'stream_session/hostCandidates'), event.candidate.toJSON());
          }
        };

        peerConnection.onconnectionstatechange = () => {
          if (peerConnection.connectionState === 'connected') {
            status.innerText = "🎉 친구와 연결되었습니다! (실시간 송출 중)";
          } else if (peerConnection.connectionState === 'disconnected') {
            status.innerText = "연결이 끊어졌습니다.";
          }
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        await set(ref(db, 'stream_session/offer'), {
          type: offer.type,
          sdp: offer.sdp
        });

        status.innerText = "✅ 준비 완료! 친구에게 index.html 링크를 주고 클릭하게 하세요.";

        // Answer 감지
        onValue(ref(db, 'stream_session/answer'), async (snapshot) => {
          const answer = snapshot.val();
          if (answer && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            
            // 큐에 쌓여 있던 Candidate 일괄 처리
            while (clientCandidateQueue.length > 0) {
              const candidate = clientCandidateQueue.shift();
              try {
                await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
              } catch (e) {
                console.error("Queue Candidate 추가 실패:", e);
              }
            }
          }
        });

        // Client Candidate 수신 처리
        onChildAdded(ref(db, 'stream_session/clientCandidates'), async (snapshot) => {
          const cand = snapshot.val();
          if (cand) {
            if (peerConnection.currentRemoteDescription) {
              try {
                await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
              } catch (e) {
                console.error("Candidate 추가 실패:", e);
              }
            } else {
              clientCandidateQueue.push(cand);
            }
          }
        });

        localStream.getVideoTracks()[0].onended = () => {
          remove(sessionRef);
          location.reload();
        };

      } catch (err) {
        console.error("스트리밍 오류:", err);
        status.className = "err-text";
        status.innerText = `[오류] ${err.name || err.message}`;
        startBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
